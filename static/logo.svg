<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D73F8"/>
      <stop offset="100%" stop-color="#1446C9"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="108" ry="108" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>
  <!-- Glowing Lightning Bolt -->
  <polygon points="275,100 185,260 245,260 225,412 335,235 270,235" fill="url(#boltGrad)" filter="url(#boltGlow)"/>
</svg>
